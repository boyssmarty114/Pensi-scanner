<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Check-In - Pentas Seni 2026</title>


  <!-- ==========================================
       HTML5 QR CODE
       ========================================== -->

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px 10px 40px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #e0f7ff,
          #f8fdff
        );

      color: #182033;

    }


    /* ==========================================
       CONTAINER
       ========================================== */

    .container {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

    }


    /* ==========================================
       HEADER
       ========================================== */

    .main-title {

      margin: 10px 0 8px;

      text-align: center;

      font-size: 32px;

      font-weight: 800;

      color: #075985;

    }


    .event-title {

      display: flex;

      flex-direction: column;

      gap: 5px;

      text-align: center;

      font-size: 21px;

      font-weight: 800;

      color: #24617a;

    }


    .event-title .theme {

      font-size: 18px;

      font-weight: 700;

      color: #087ea4;

    }


    /* ==========================================
       SCANNER CARD
       ========================================== */

    .scanner-card {

      margin-top: 28px;

      padding: 25px 18px 30px;

      background: white;

      border-radius: 24px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.10);

    }


    .instruction {

      text-align: center;

      font-size: 21px;

      font-weight: 800;

      color: #24617a;

    }


    .sub-instruction {

      margin-top: 7px;

      margin-bottom: 20px;

      text-align: center;

      font-size: 14px;

      color: #607d8b;

    }


    /* ==========================================
       QR READER
       ========================================== */

    #reader {

      width: 100%;

      max-width: 450px;

      margin: 0 auto;

      overflow: hidden;

      border-radius: 18px;

    }


    #reader video {

      width: 100% !important;

      border-radius: 18px;

    }


    /* ==========================================
       RESULT
       ========================================== */

    #result {

      margin-top: 22px;

    }


    .ticket-card {

      padding: 22px;

      background: #f8fafc;

      border-radius: 18px;

      border: 1px solid #e2e8f0;

    }


    .ticket-card h2 {

      margin-top: 0;

      margin-bottom: 20px;

      text-align: center;

      color: #075985;

    }


    .ticket-info {

      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      padding: 12px 0;

      border-bottom: 1px solid #e2e8f0;

      font-size: 16px;

    }


    .ticket-info strong {

      min-width: 135px;

    }


    /* ==========================================
       BUTTON
       ========================================== */

    button {

      width: 100%;

      margin-top: 18px;

      padding: 15px;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

    }


    .checkin-btn {

      background: #087ea4;

      color: white;

    }


    .scan-again-btn {

      background: #e9ecf5;

      color: #182033;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    /* ==========================================
       STATUS
       ========================================== */

    .success {

      color: #15803d !important;

    }


    .warning {

      color: #c2410c !important;

    }


    .error {

      color: #b91c1c !important;

    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 600px) {

      body {

        padding:
          15px
          8px
          30px;

      }


      .main-title {

        font-size: 28px;

      }


      .event-title {

        font-size: 19px;

      }


      .event-title .theme {

        font-size: 17px;

      }


      .scanner-card {

        margin-top: 22px;

        padding:
          22px
          14px
          25px;

        border-radius: 22px;

      }


      .instruction {

        font-size: 19px;

      }


      .sub-instruction {

        font-size: 13px;

      }


      .ticket-info {

        font-size: 15px;

      }


      .ticket-info strong {

        min-width: 120px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ==========================================
       HEADER
       ========================================== -->

  <h1 class="main-title">
    SCANNER CHECK-IN
  </h1>


  <div class="event-title">

    <span>
      PENTAS SENI 2026
    </span>

    <span class="theme">
      UNDER THE SEA
    </span>

  </div>


  <!-- ==========================================
       SCANNER
       ========================================== -->

  <div class="scanner-card">


    <div class="instruction">
      Arahkan kamera ke QR tiket
    </div>


    <div class="sub-instruction">
      Kamera aktif — arahkan ke QR tiket
    </div>


    <div id="reader"></div>


    <div id="result"></div>


  </div>


</div>



<script>


  /* ==========================================
     GOOGLE APPS SCRIPT WEB APP
     ========================================== */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxPEu82OnIwQJiawNhW1Qbaqg6GyXUCYpd9akrQfG_dl--3JKjfX4gHe1GR7aUHsYkQxQ/exec";


  /* ==========================================
     VARIABLE
     ========================================== */

  let scanner = null;

  let scanning = true;

  let currentTicketId = "";


  /* ==========================================
     JSONP
     ========================================== */

  function jsonp(url, callback) {

    const callbackName =
      "callback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 10000
      );


    const script =
      document.createElement("script");


    window[callbackName] =
      function(data) {

        try {

          callback(data);

        }

        finally {

          delete window[callbackName];


          if (script.parentNode) {

            script.parentNode.removeChild(
              script
            );

          }

        }

      };


    script.onerror =
      function() {

        delete window[callbackName];


        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }


        callback({

          success: false,

          message:
            "Tidak dapat terhubung ke server."

        });

      };


    script.src =
      url +
      (
        url.includes("?")
          ? "&"
          : "?"
      ) +
      "callback=" +
      callbackName;


    document.body.appendChild(script);

  }


  /* ==========================================
     AMBIL ID DARI QR
     ========================================== */

  function extractTicketId(text) {

    text =
      String(text).trim();


    /*
      QR utama kita berisi ID langsung.

      Contoh:
      HEI-001

      Tetapi fungsi ini juga bisa
      membaca QR yang berisi URL.
    */


    try {

      const url =
        new URL(text);


      const id =
        url.searchParams.get("id");


      if (id) {

        return id;

      }

    }

    catch (e) {

      /*
        Bukan URL.
        Berarti ID langsung.
      */

    }


    return text;

  }


  /* ==========================================
     QR BERHASIL DIBACA
     ========================================== */

  function onScanSuccess(decodedText) {


    if (!scanning) {

      return;

    }


    scanning = false;


    currentTicketId =
      extractTicketId(
        decodedText
      );


    /*
      Hentikan kamera setelah QR terbaca.
    */

    if (scanner) {

      scanner
        .stop()
        .catch(
          function(error) {

            console.log(
              "Scanner stop:",
              error
            );

          }
        );

    }


    document.getElementById(
      "reader"
    ).style.display = "none";


    /*
      Periksa tiket ke Google Apps Script.
    */

    getTicket(
      currentTicketId
    );

  }


  /* ==========================================
     CEK DATA TIKET
     ========================================== */

  function getTicket(ticketId) {


    const result =
      document.getElementById(
        "result"
      );


    result.innerHTML = `

      <div class="ticket-card">

        <h2>
          Memeriksa tiket...
        </h2>

        <p style="text-align:center;">
          Mohon tunggu.
        </p>

      </div>

    `;


    const url =
      API_URL +
      "?action=getTicket&id=" +
      encodeURIComponent(
        ticketId
      );


    jsonp(
      url,
      function(data) {


        /*
          TIKET TIDAK DITEMUKAN
        */

        if (
          !data ||
          data.success === false ||
          data.valid === false
        ) {


          result.innerHTML = `

            <div class="ticket-card">

              <h2 class="error">
                ❌ Tiket Tidak Ditemukan
              </h2>


              <p>
                ID Tiket:
                <strong>
                  ${escapeHtml(ticketId)}
                </strong>
              </p>


              <button
                class="scan-again-btn"
                onclick="scanAgain()">

                Scan Tiket Lain

              </button>

            </div>

          `;


          return;

        }


        /*
          AMBIL DATA TIKET
        */

        const nama =
          data.nama || "-";


        const jumlah =
          data.jumlahKeluarga || "-";


        const kursi =
          data.noKursi || "-";


        const status =
          String(
            data.status || ""
          ).toLowerCase();


        /*
          TIKET SUDAH DIGUNAKAN
        */

        if (
          status === "hadir"
        ) {


          result.innerHTML = `

            <div class="ticket-card">


              <h2>
                Tiket Ditemukan
              </h2>


              <div class="ticket-info">

                <strong>
                  ID Tiket
                </strong>

                <span>
                  ${escapeHtml(ticketId)}
                </span>

              </div>


              <div class="ticket-info">

                <strong>
                  Nama Anak
                </strong>

                <span>
                  ${escapeHtml(nama)}
                </span>

              </div>


              <div class="ticket-info">

                <strong>
                  Jumlah Keluarga
                </strong>

                <span>
                  ${escapeHtml(jumlah)}
                  orang
                </span>

              </div>


              <div class="ticket-info">

                <strong>
                  Nomor Kursi
                </strong>

                <span>
                  ${escapeHtml(kursi)}
                </span>

              </div>


              <p
                class="warning"
                style="
                  text-align:center;
                  font-weight:800;
                  margin-top:20px;
                "
              >

                ⚠️ Tiket ini sudah digunakan.

              </p>


              <button
                class="scan-again-btn"
                onclick="scanAgain()">

                Scan Tiket Lain

              </button>


            </div>

          `;


          return;

        }


        /*
          TIKET VALID
        */

        result.innerHTML = `

          <div class="ticket-card">


            <h2>
              ✓ Tiket Ditemukan
            </h2>


            <div class="ticket-info">

              <strong>
                ID Tiket
              </strong>

              <span>
                ${escapeHtml(ticketId)}
              </span>

            </div>


            <div class="ticket-info">

              <strong>
                Nama Anak
              </strong>

              <span>
                ${escapeHtml(nama)}
              </span>

            </div>


            <div class="ticket-info">

              <strong>
                Jumlah Keluarga
              </strong>

              <span>
                ${escapeHtml(jumlah)}
                orang
              </span>

            </div>


            <div class="ticket-info">

              <strong>
                Nomor Kursi
              </strong>

              <span>
                ${escapeHtml(kursi)}
              </span>

            </div>


            <button
              class="checkin-btn"
              onclick="checkIn()">

              CHECK-IN

            </button>


            <button
              class="scan-again-btn"
              onclick="scanAgain()">

              Scan Tiket Lain

            </button>


          </div>

        `;


      }

    );

  }


  /* ==========================================
     CHECK-IN
     ========================================== */

  function checkIn() {


    if (!currentTicketId) {

      return;

    }


    const result =
      document.getElementById(
        "result"
      );


    result.innerHTML = `

      <div class="ticket-card">

        <h2>
          Memproses Check-In...
        </h2>

        <p style="text-align:center;">
          Mohon tunggu.
        </p>

      </div>

    `;


    const url =
      API_URL +
      "?action=checkIn&id=" +
      encodeURIComponent(
        currentTicketId
      );


    jsonp(
      url,
      function(data) {


        /*
          TIDAK ADA RESPONS
        */

        if (!data) {


          result.innerHTML = `

            <div class="ticket-card">

              <h2 class="error">
                ❌ Terjadi Kesalahan
              </h2>


              <p style="text-align:center;">

                Tidak ada respons
                dari server.

              </p>


              <button
                class="scan-again-btn"
                onclick="scanAgain()">

                Coba Lagi

              </button>

            </div>

          `;


          return;

        }


        /*
          TIKET SUDAH DIGUNAKAN
        */

        if (
          data.alreadyUsed
        ) {


          result.innerHTML = `

            <div class="ticket-card">

              <h2 class="warning">

                ⚠️ Sudah Check-In

              </h2>


              <p style="text-align:center;">

                Tiket ini sebelumnya
                sudah digunakan.

              </p>


              <button
                class="scan-again-btn"
                onclick="scanAgain()">

                Scan Tiket Lain

              </button>

            </div>

          `;


          return;

        }


        /*
          CHECK-IN BERHASIL
        */

        if (
          data.success
        ) {


          result.innerHTML = `

            <div class="ticket-card">


              <h2 class="success">

                ✓ CHECK-IN BERHASIL

              </h2>


              <p
                style="
                  text-align:center;
                  font-weight:700;
                "
              >

                Tiket berhasil dicatat
                sebagai hadir.

              </p>


              <p
                style="
                  text-align:center;
                  font-size:13px;
                  color:#64748b;
                "
              >

                ${escapeHtml(
                  data.waktuCheckIn || ""
                )}

              </p>


              <button
                class="scan-again-btn"
                onclick="scanAgain()">

                Scan Tiket Berikutnya

              </button>


            </div>

          `;


          return;

        }


        /*
          CHECK-IN GAGAL
        */

        result.innerHTML = `

          <div class="ticket-card">


            <h2 class="error">

              ❌ Check-In Gagal

            </h2>


            <p style="text-align:center;">

              ${escapeHtml(
                data.message ||
                "Terjadi kesalahan."
              )}

            </p>


            <button
              class="scan-again-btn"
              onclick="scanAgain()">

              Scan Lagi

            </button>


          </div>

        `;


      }

    );

  }


  /* ==========================================
     SCAN LAGI
     ========================================== */

  function scanAgain() {


    currentTicketId = "";


    document.getElementById(
      "result"
    ).innerHTML = "";


    document.getElementById(
      "reader"
    ).style.display = "block";


    scanning = true;


    startScanner();

  }


  /* ==========================================
     START CAMERA
     ========================================== */

  function startScanner() {


    /*
      Jika scanner lama masih ada,
      bersihkan terlebih dahulu.
    */

    if (scanner) {

      scanner
        .clear()
        .catch(
          function() {}
        );

    }


    /*
      Buat scanner baru.
    */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
      Pengaturan kamera.
    */

    const config = {

      fps: 15,

      qrbox: {

        width: 300,

        height: 300

      },

      aspectRatio: 1.0,

      formatsToSupport: [

        Html5QrcodeSupportedFormats.QR_CODE

      ]

    };


    /*
      Jalankan kamera belakang.
    */

    scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      function(errorMessage) {

        /*
          Error sementara saat
          kamera sedang mencari QR
          diabaikan.
        */

      }

    )

    .catch(
      function(error) {


        document.getElementById(
          "reader"
        ).innerHTML = `

          <div class="ticket-card">


            <h2 class="error">

              ❌ Kamera Tidak Dapat Digunakan

            </h2>


            <p
              style="
                text-align:center;
              "
            >

              Pastikan browser memiliki
              izin menggunakan kamera.

            </p>


          </div>

        `;


        console.error(
          "Camera error:",
          error
        );

      }
    );

  }


  /* ==========================================
     ESCAPE HTML
     ========================================== */

  function escapeHtml(text) {


    return String(

      text == null
        ? ""
        : text

    )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ==========================================
     MULAI SCANNER
     ========================================== */

  window.addEventListener(
    "load",
    function() {

      startScanner();

    }
  );


</script>


</body>

</html>
