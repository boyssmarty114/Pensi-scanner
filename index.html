<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Check-In — Pentas Seni 2026</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f9;
      color: #182033;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 18px 40px;
      text-align: center;
    }

    /* =========================
       JUDUL
       ========================= */

    .main-title {
      font-size: 34px;
      font-weight: 800;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .event-title {
      margin-top: 10px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
    }

    .event-title .theme {
      display: block;
      margin-top: 2px;
    }

    /* =========================
       SCANNER CARD
       ========================= */

    .scanner-card {
      background: white;
      margin-top: 30px;
      padding: 28px 20px 25px;
      border-radius: 28px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .instruction {
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .sub-instruction {
      font-size: 18px;
      color: #777;
      margin-bottom: 24px;
    }

    #reader {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    /* =========================
       HASIL TIKET
       ========================= */

    #result {
      margin-top: 25px;
    }

    .ticket-card {
      background: #f8f9fc;
      border-radius: 20px;
      padding: 22px;
      text-align: left;
      border: 1px solid #e5e7eb;
    }

    .ticket-card h2 {
      margin-top: 0;
      text-align: center;
    }

    .ticket-info {
      margin: 12px 0;
      font-size: 17px;
    }

    .ticket-info strong {
      display: inline-block;
      min-width: 150px;
    }

    .success {
      color: #16803c;
      font-weight: 700;
    }

    .warning {
      color: #c47b00;
      font-weight: 700;
    }

    .error {
      color: #c62828;
      font-weight: 700;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .checkin-btn {
      background: #182b72;
      color: white;
    }

    .scan-again-btn {
      background: #e9ecf5;
      color: #182033;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 25px 14px 30px;
      }

      .main-title {
        font-size: 30px;
      }

      .event-title {
        font-size: 20px;
      }

      .scanner-card {
        margin-top: 25px;
        padding: 24px 15px 20px;
        border-radius: 24px;
      }

      .instruction {
        font-size: 21px;
      }

      .sub-instruction {
        font-size: 16px;
      }

      .ticket-info {
        font-size: 16px;
      }

      .ticket-info strong {
        min-width: 125px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- =========================
       HEADER SCANNER
       ========================= -->

  <h1 class="main-title">
    SCANNER CHECK-IN
  </h1>

  <div class="event-title">
    <span>PENTAS SENI 2026</span>
    <span class="theme">UNDER THE SEA</span>
  </div>


  <!-- =========================
       SCANNER
       ========================= -->

  <div class="scanner-card">

    <div class="instruction">
      Arahkan kamera ke QR tiket
    </div>

    <div class="sub-instruction">
      Kamera aktif — arahkan ke QR tiket
    </div>

    <div id="reader"></div>

    <div id="result"></div>

  </div>

</div>


<script>

  // ==========================================
  // URL WEB APP GOOGLE APPS SCRIPT
  // ==========================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxPEu82OnIwQJiawNhW1Qbaqg6GyXUCYpd9akrQfG_dl--3JKjfX4gHe1GR7aUHsYkQxQ/exec";


  let scanner = null;
  let scanning = true;
  let currentTicketId = "";


  // ==========================================
  // JSONP REQUEST
  // ==========================================

  function jsonp(url, callback) {

    const callbackName =
      "callback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);

    const script = document.createElement("script");

    window[callbackName] = function(data) {

      try {
        callback(data);
      } finally {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }
    };

    script.src =
      url +
      (url.includes("?") ? "&" : "?") +
      "callback=" +
      callbackName;

    script.onerror = function() {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      callback({
        ok: false,
        error: "Tidak dapat terhubung ke server."
      });
    };

    document.body.appendChild(script);
  }


  // ==========================================
  // AMBIL ID DARI HASIL QR
  // ==========================================

  function extractTicketId(text) {

    text = String(text).trim();

    try {

      const url = new URL(text);

      const id = url.searchParams.get("id");

      if (id) {
        return id;
      }

    } catch (e) {
      // Bukan URL
    }

    return text;
  }


  // ==========================================
  // KETIKA QR BERHASIL DIBACA
  // ==========================================

  function onScanSuccess(decodedText) {

    if (!scanning) return;

    scanning = false;

    currentTicketId = extractTicketId(decodedText);

    if (scanner) {
      scanner.clear().catch(() => {});
    }

    document.getElementById("reader").style.display = "none";

    getTicket(currentTicketId);
  }


  // ==========================================
  // CEK DATA TIKET
  // ==========================================

  function getTicket(ticketId) {

    const result = document.getElementById("result");

    result.innerHTML = `
      <div class="ticket-card">
        <h2>Memeriksa tiket...</h2>
        <p style="text-align:center;">
          Mohon tunggu.
        </p>
      </div>
    `;

    const url =
      API_URL +
      "?action=getTicket&id=" +
      encodeURIComponent(ticketId);

    jsonp(url, function(data) {

      if (!data || data.ok === false || data.valid === false) {

        result.innerHTML = `
          <div class="ticket-card">
            <h2 class="error">❌ Tiket Tidak Ditemukan</h2>

            <p>
              ID Tiket:
              <strong>${escapeHtml(ticketId)}</strong>
            </p>

            <button
              class="scan-again-btn"
              onclick="scanAgain()">
              Scan Tiket Lain
            </button>
          </div>
        `;

        return;
      }


      // ======================================
      // TAMPILKAN DATA TIKET
      // ======================================

      const nama =
        data.nama || "-";

      const jumlah =
        data.jumlahKeluarga || "-";

      const kursi =
        data.noKursi || "-";

      const status =
        data.status || "";


      let statusHTML = "";

      if (status.toLowerCase() === "hadir") {

        statusHTML = `
          <p class="warning">
            ⚠️ Tiket ini sudah digunakan.
          </p>
        `;

        result.innerHTML = `
          <div class="ticket-card">

            <h2>Tiket Ditemukan</h2>

            <div class="ticket-info">
              <strong>ID Tiket</strong>:
              ${escapeHtml(ticketId)}
            </div>

            <div class="ticket-info">
              <strong>Nama Anak</strong>:
              ${escapeHtml(nama)}
            </div>

            <div class="ticket-info">
              <strong>Jumlah Keluarga</strong>:
              ${escapeHtml(jumlah)}
            </div>

            <div class="ticket-info">
              <strong>Nomor Kursi</strong>:
              ${escapeHtml(kursi)}
            </div>

            ${statusHTML}

            <button
              class="scan-again-btn"
              onclick="scanAgain()">
              Scan Tiket Lain
            </button>

          </div>
        `;

        return;
      }


      // ======================================
      // TIKET BELUM DIGUNAKAN
      // ======================================

      result.innerHTML = `
        <div class="ticket-card">

          <h2 class="success">
            ✓ Tiket Valid
          </h2>

          <div class="ticket-info">
            <strong>ID Tiket</strong>:
            ${escapeHtml(ticketId)}
          </div>

          <div class="ticket-info">
            <strong>Nama Anak</strong>:
            ${escapeHtml(nama)}
          </div>

          <div class="ticket-info">
            <strong>Jumlah Keluarga</strong>:
            ${escapeHtml(jumlah)}
          </div>

          <div class="ticket-info">
            <strong>Nomor Kursi</strong>:
            ${escapeHtml(kursi)}
          </div>

          <button
            class="checkin-btn"
            onclick="checkIn()">
            ✓ CHECK-IN
          </button>

          <button
            class="scan-again-btn"
            onclick="scanAgain()">
            Scan Tiket Lain
          </button>

        </div>
      `;

    });
  }


  // ==========================================
  // CHECK-IN
  // ==========================================

  function checkIn() {

    if (!currentTicketId) return;

    const result =
      document.getElementById("result");

    result.innerHTML = `
      <div class="ticket-card">
        <h2>Memproses Check-In...</h2>
        <p style="text-align:center;">
          Mohon tunggu.
        </p>
      </div>
    `;


    const url =
      API_URL +
      "?action=checkIn&id=" +
      encodeURIComponent(currentTicketId);


    jsonp(url, function(data) {

      if (!data) {

        result.innerHTML = `
          <div class="ticket-card">
            <h2 class="error">
              ❌ Terjadi kesalahan
            </h2>

            <p>
              Tidak ada respons dari server.
            </p>

            <button
              class="scan-again-btn"
              onclick="scanAgain()">
              Coba Lagi
            </button>
          </div>
        `;

        return;
      }


      if (data.alreadyUsed) {

        result.innerHTML = `
          <div class="ticket-card">

            <h2 class="warning">
              ⚠️ Sudah Check-In
            </h2>

            <p style="text-align:center;">
              Tiket ini sebelumnya sudah digunakan.
            </p>

            <button
              class="scan-again-btn"
              onclick="scanAgain()">
              Scan Tiket Lain
            </button>

          </div>
        `;

        return;
      }


      if (data.ok) {

        result.innerHTML = `
          <div class="ticket-card">

            <h2 class="success">
              ✓ CHECK-IN BERHASIL
            </h2>

            <p style="text-align:center;">
              Tiket berhasil dicatat sebagai hadir.
            </p>

            <button
              class="scan-again-btn"
              onclick="scanAgain()">
              Scan Tiket Berikutnya
            </button>

          </div>
        `;

        return;
      }


      result.innerHTML = `
        <div class="ticket-card">

          <h2 class="error">
            ❌ Check-In Gagal
          </h2>

          <p style="text-align:center;">
            ${escapeHtml(data.error || "Terjadi kesalahan.")}
          </p>

          <button
            class="scan-again-btn"
            onclick="scanAgain()">
            Scan Lagi
          </button>

        </div>
      `;

    });

  }


  // ==========================================
  // SCAN LAGI
  // ==========================================

  function scanAgain() {

    currentTicketId = "";

    document.getElementById("result").innerHTML = "";

    document.getElementById("reader").style.display = "block";

    scanning = true;

    startScanner();
  }


  // ==========================================
  // START CAMERA
  // ==========================================

  function startScanner() {

    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      function(errorMessage) {
        // Abaikan error scan sementara
      }

    ).catch(function(error) {

      document.getElementById("reader").innerHTML = `
        <div class="ticket-card">
          <h2 class="error">
            ❌ Kamera tidak dapat digunakan
          </h2>

          <p>
            Pastikan browser memiliki izin menggunakan kamera.
          </p>
        </div>
      `;

    });

  }


  // ==========================================
  // ESCAPE HTML
  // ==========================================

  function escapeHtml(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ==========================================
  // MULAI SCANNER
  // ==========================================

  window.addEventListener("load", function() {

    startScanner();

  });

</script>

</body>
</html>
